name: AuraGuard CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: auraguard/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: auraguard

      - name: Run Unit Tests (Vitest)
        run: npm run test
        working-directory: auraguard

      - name: Build Next.js Application
        run: npm run build
        working-directory: auraguard
